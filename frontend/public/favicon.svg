<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="velaroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e2b3" />
      <stop offset="45%" stop-color="#d4af37" />
      <stop offset="80%" stop-color="#aa8024" />
      <stop offset="100%" stop-color="#dfba65" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark luxury background -->
  <rect width="120" height="120" rx="26" fill="#0c0c0d" />
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="116" height="116" rx="24" fill="none" stroke="#d4af37" stroke-width="1" stroke-opacity="0.25" />

  <!-- Elegant Luxury 'V' Monogram -->
  <g filter="url(#subtleGlow)">
    <!-- Left Wing / Stem of V -->
    <path 
      d="M 30,42 C 34,42 41,47 46,60 L 59,90 C 59.5,91 60.5,91 61,90 L 74,60 C 79,47 86,42 90,42 C 86,45 81,52 76,64 L 62,93 C 61,95 59,95 58,93 L 44,64 C 39,52 34,45 30,42 Z" 
      fill="url(#velaroGold)" 
    />
    
    <!-- Sculpted Left Blade Highlight for dimensionality -->
    <path 
      d="M 33,43 C 38,44 43,49 48,62 L 60,89 L 58,93 L 44,64 C 39,52 35,46 33,43 Z" 
      fill="#faeec8" 
      opacity="0.45"
    />
  </g>
</svg>
